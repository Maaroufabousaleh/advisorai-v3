[project]
name = "advisorai-v3"
version = "0.1.0"
description = "Deterministic, point-in-time-safe foundation for AdvisorAI V3"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pyarrow>=18,<26",
  "duckdb>=1.1,<2",
  "polars>=1.20,<2",
  "pyyaml>=6.0,<7",
  "psutil>=6.1,<8",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.optional-dependencies]
runtimes = [
  "pydantic-ai>=2.24,<3",
  "pydantic-graph>=2.24,<3",
  "prefect>=3.8,<4",
  "sf-hamilton>=1.90,<2",
  "litellm>=1.95,<2",
  "nautilus-trader>=1.231,<2",
]
dashboard = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]
transition = [
  "websockets>=13,<17",
]
models = [
  "lightgbm>=4.6,<5",
  "transformers>=5.5,<5.6",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisorai"]
force-include = { "LICENSE" = "LICENSE", "THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["advisorai"]
branch = true
