schema_version: 1
inventory_kind: advisorai_v3_third_party_license_inventory

audit:
  repository: Maaroufabousaleh/advisorai-v3
  repository_commit: 8f8b7cb89c98191b0d0a06498aea5d2438018ccc
  audited_at: '2026-08-21'
  method: authoritative-source-first; pinned package/model metadata; repository and history scan
  source_lock_files:
    - uv.lock (211 locked Python package records; sha256: 2baec5b4342fa9cef1c199ceb958621b320e8107a70abae26237d173b83ce0ac)
    - dashboard/package-lock.json (122 locked npm package records; sha256: e4e03baed9034f13aa26c1ca3c2e2f9a39c7e1bf845d2aecfcdd3fc936c3e93c)
  important_limitations:
    - Package-lock and uv.lock do not provide a complete authoritative license field for every locked record.
    - Source-only publication does not bundle package-managed dependencies, model weights, or provider data.
    - Model-card license statements do not resolve base-model, tokenizer, training-data, or gated-term restrictions.
    - This inventory is engineering evidence, not a legal opinion.

