name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-suite:
    name: Full Python suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: 0.13.7
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - name: Full test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --locked pytest -q

  phase-acceptance:
    name: Phase acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: 0.13.7
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - name: Run phase acceptance suites
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --locked python scripts/verify_acceptance.py

  quality-and-dependencies:
    name: Lint and dependency validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: 0.13.7
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Verify lock and installed dependency consistency
        run: |
          uv lock --check
          uv pip check
      - name: Validate pinned dependency license inventory
        run: uv run --locked python scripts/check_license_policy.py
      - name: Ruff
        run: uv run --locked ruff check .

  dashboard-build:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Audit dashboard dependencies
        run: npm audit --audit-level=high
      - run: npm run build
